name: Monorepo CI Pipeline

# Trigger conditions:
# - Runs automatically whenever code is pushed to the 'main' branch
# - Runs on every pull request targeting 'main'
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Type-Check & Production Build
    runs-on: ubuntu-latest

    steps:
      # Step 1: Check out the repository source code onto the runner
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Install pnpm matching packageManager defined in package.json
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.13.1

      # Step 3: Install Node.js (v22) and configure dependency cache for pnpm
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      # Step 4: Install dependencies strictly using pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Step 5: Verify TypeScript types across all workspaces in parallel via Turbo
      - name: TypeScript typecheck
        run: pnpm check-types

      # Step 6: Verify production build across all workspaces and generate unified dist
      - name: Build monorepo and generate unified dist
        run: pnpm build

